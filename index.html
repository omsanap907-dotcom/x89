<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>ToolMap — Find a tool</title><link rel="stylesheet" href="styles.css"></head><body>
<header><a class="brand" href="#"><span>✦</span><b>ToolMap</b></a><a href="#categories">Categories</a></header>
<main>
<section class="hero"><div class="hero-inner"><span class="eyebrow">TOOL DIRECTORY</span><h1>What do you need?</h1><p>Find a tool in seconds. Search by task or choose a category.</p>
<div class="search-box"><span>⌕</span><input id="search" type="search" placeholder="Search e.g. AI detector, PDF, research…" autocomplete="off"><button id="clear">×</button></div>
<div class="suggestions"><button data-query="AI detector">AI detector</button><button data-query="Research">Research</button><button data-query="Writing">Writing</button><button data-query="PDF">PDF</button></div></div></section>
<section class="home-cats" id="categories"><div class="section-title"><h2>Choose a category</h2><span id="categoryHint">Browse all tools</span></div><div id="categoryCards" class="category-cards"></div></section>
<section class="results-section" id="tools"><div class="results-top"><div><span class="eyebrow">RESULTS</span><h2 id="resultsTitle">All tools</h2></div><span id="resultCount">0 tools</span></div><div class="active-filters" id="activeFilters"></div><div class="tool-grid" id="results"></div><div class="empty" id="empty" hidden><h3>No tools found</h3><p>Try another search or category.</p><button id="reset">Show all tools</button></div></section>
</main><footer>ToolMap · Useful tools, easier to find.</footer><script src="app.js"></script></body></html>
