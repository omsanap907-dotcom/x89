<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A public directory that organizes useful tools by what they do and helps you find the right tool for a task.">
  <title>ToolMap — Find the right tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">⌕</span><div><strong>ToolMap</strong><small>Discover • Search • Organize</small></div></div>
    <button id="themeBtn" class="ghost">Light Mode</button>
  </header>
  <main>
    <section class="hero">
      <div class="eyebrow">PUBLIC TOOL DIRECTORY</div>
      <h1>Find the right tool for the job.</h1>
      <p>Search by what you want to accomplish. Tools are organized from their capabilities, inputs and descriptions instead of relying on a fixed category list.</p>
      <div class="searchbox"><span>⌕</span><input id="search" autocomplete="off" placeholder="What do you need to do? e.g. edit a video, analyze data, find a PDF"><button id="clear" aria-label="Clear search">×</button></div>
      <div id="chips" class="chips"></div>
    </section>
    <div class="layout">
      <aside class="sidebar"><div class="side-title">Categories</div><div id="categories"></div></aside>
      <section class="content">
        <div class="results-head"><div><span id="resultCount">0</span> tools</div><div class="status">Curated directory</div></div>
        <div id="results" class="results"></div>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
